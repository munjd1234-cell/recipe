---
layout: null
---
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECIPE AV - Global Network</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --main-red: #ff0042; --bg-black: #060606; --card-bg: #121212; --text-gray: #b0b0b0; }
        body { background-color: var(--bg-black); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        header { background: #000; padding: 12px 5%; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; }
        .logo { color: var(--main-red); font-size: 26px; font-weight: 900; text-decoration: none; }
        .container { padding: 0 5%; max-width: 1600px; margin: 0 auto; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 40px 0 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .section-title { font-size: 20px; font-weight: bold; }
        .section-title span { color: var(--main-red); margin-right: 8px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .video-card { background: var(--card-bg); border-radius: 4px; overflow: hidden; position: relative; transition: 0.2s; cursor: pointer; }
        .video-card:hover { transform: translateY(-5px); z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .thumb-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
        .main-thumb { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 5; transition: opacity 0.3s; }
        .video-card:hover .main-thumb { opacity: 0; }
        .yt-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; transform: scale(1.3); }
        .video-info { padding: 10px; }
        .video-title { font-size: 14px; font-weight: 500; height: 40px; overflow: hidden; color: #ececec; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        footer { background: #000; border-top: 1px solid #222; padding: 60px 5%; margin-top: 100px; text-align: center; color: #555; font-size: 12px; }
    </style>
</head>
<body>
<header>
    <a href="./" class="logo">RECIPE AV</a>
    <input type="text" style="background:#1a1a1a; border:1px solid #333; padding:8px 20px; color:white; border-radius:20px;" placeholder="검색...">
</header>

<div class="container">
    <div class="section-header">
        <div class="section-title"><span>●</span> 최근 업데이트</div>
    </div>
    <div class="video-grid">
        {% for post in site.posts %}
        <div class="video-card" onmouseenter="playYT('player-{{ forloop.index }}')" onmouseleave="stopYT('player-{{ forloop.index }}')" onclick="location.href='{{ post.url | relative_url }}'">
            <div class="thumb-box">
                <div id="thumb-{{ forloop.index }}" class="main-thumb" style="background-image: url('{{ post.image }}');"></div>
                <div id="player-{{ forloop.index }}" class="yt-player" data-id="{{ post.youtube_id }}"></div>
            </div>
            <div class="video-info">
                <div class="video-title">{{ post.title }}</div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<footer>
    상호명: DHC Solution (디에이치씨솔루션) | 대표자: 문종대<br>© 2026 World Recipe AI.
</footer>

<script>
    var players = {};
    function onYouTubeIframeAPIReady() {
        document.querySelectorAll('.yt-player').forEach(function(el) {
            var videoId = el.getAttribute('data-id');
            if(videoId) {
                players[el.id] = new YT.Player(el.id, {
                    videoId: videoId,
                    playerVars: { 'autoplay': 0, 'controls': 0, 'mute': 1, 'loop': 1, 'playlist': videoId }
                });
            }
        });
    }
    function playYT(id) { if(players[id]) players[id].playVideo(); }
    function stopYT(id) { if(players[id]) players[id].stopVideo(); }
</script>
</body>
</html>
