<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} - RECIPE MATE</title>
    <style>
        body { background: #0b0b0b; color: white; font-family: sans-serif; margin: 0; }
        header { background: #000; padding: 15px 5%; border-bottom: 1px solid #222; }
        .logo { color: #ff0042; font-size: 22px; font-weight: 900; text-decoration: none; }
        .main-content { display: flex; flex-wrap: wrap; padding: 20px 5%; gap: 30px; max-width: 1400px; margin: 0 auto; }
        .video-side { flex: 2; min-width: 300px; }
        .recommend-side { flex: 1; min-width: 280px; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .video-box iframe { width: 100%; height: 100%; border: none; }
        .ad-box { background: #1a1a1a; padding: 18px; margin: 25px 0; border: 1px dashed #ff0042; color: #ff0042; text-align: center; font-weight: bold; cursor: pointer; border-radius: 8px; }
        .side-item { display: flex; gap: 12px; margin-bottom: 18px; text-decoration: none; color: white; font-size: 13px; }
        .side-thumb { width: 130px; aspect-ratio: 16/9; background-size: cover; background-position: center; border-radius: 6px; flex-shrink: 0; }
        h1 { font-size: 26px; margin: 25px 0 10px; color: #fff; }
    </style>
</head>
<body>
<header>
    <a href="{{ '/' | relative_url }}" class="logo">RECIPE MATE</a>
</header>

<div class="main-content">
    <div class="video-side">
        <div class="video-box">
            <iframe src="https://www.youtube.com/embed/{{ page.youtube_id }}?autoplay=1&rel=0" allowfullscreen></iframe>
        </div>
        <h1>{{ page.title }}</h1>
        <div class="ad-box" onclick="window.open('https://link.coupang.com/...')">
            [AD] RECIPE MATE가 추천하는 오늘의 조리도구 특가 확인하기 >
        </div>
        <div style="color: #aaa; line-height: 1.8; font-size: 15px;">
            {{ content }}
        </div>
    </div>
    
    <div class="recommend-side">
        <h3 style="border-left: 5px solid #ff0042; padding-left: 12px; margin-bottom: 25px;">함께 보면 좋은 레시피</h3>
        {% for post in site.posts limit:12 %}
        <a href="{{ post.url | relative_url }}" class="side-item">
            <div class="side-thumb" style="background-image: url('{{ post.image }}');"></div>
            <div>
                <div style="font-weight: 600; margin-bottom: 4px; line-height: 1.3;">{{ post.title }}</div>
                <div style="color: #666; font-size: 12px;">{{ post.calories | default: "Healthy Choice" }}</div>
            </div>
        </a>
        {% endfor %}
    </div>
</div>

<footer style="background:#000; padding:40px; text-align:center; border-top:1px solid #222; margin-top:60px; color:#444; font-size:12px;">
    상호명: DHC Solution (디에이치씨솔루션) | 대표자: 문종대 | 주소: 경기도 하남시 미사강변동로
</footer>
</body>
</html>
