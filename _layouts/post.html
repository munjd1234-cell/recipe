<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} - RECIPE MATE</title>
    <style>
        body { background: #0b0b0b; color: white; font-family: sans-serif; margin: 0; }
        header { background: #000; padding: 15px 5%; border-bottom: 1px solid #222; }
        .logo { color: #ff0042; font-size: 22px; font-weight: 900; text-decoration: none; }
        .main-content { display: flex; flex-wrap: wrap; padding: 20px 5%; gap: 30px; max-width: 1400px; margin: 0 auto; }
        .video-side { flex: 2; min-width: 300px; }
        .recommend-side { flex: 1; min-width: 280px; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
        .video-box iframe { width: 100%; height: 100%; border: none; }
        .info-box { background: #1a1a1a; padding: 20px; border-radius: 8px; margin: 20px 0; border: 1px solid #333; }
        .ad-box { background: #1a1a1a; padding: 15px; margin: 20px 0; border: 1px dashed #ff0042; color: #ff0042; text-align: center; font-weight: bold; cursor: pointer; }
        .side-item { display: flex; gap: 10px; margin-bottom: 15px; text-decoration: none; color: white; }
        .side-thumb { width: 120px; aspect-ratio: 16/9; background-size: cover; border-radius: 6px; flex-shrink: 0; }
    </style>
</head>
<body>
<header><a href="{{ '/' | relative_url }}" class="logo">RECIPE MATE</a></header>
<div class="main-content">
    <div class="video-side">
        <div class="video-box">
            <iframe src="https://www.youtube.com/embed/{{ page.youtube_id }}?autoplay=1" allowfullscreen></iframe>
        </div>
        <h1>{{ page.title }}</h1>
        
        <div class="info-box">
            <h4 style="color: #ff0042; margin: 0 0 10px 0;">🛒 준비물</h4>
            <p style="margin: 0;">{{ page.ingredients }}</p>
            <hr style="border: 0.5px solid #333; margin: 15px 0;">
            <h4 style="color: #ff0042; margin: 0 0 10px 0;">🔥 칼로리</h4>
            <p style="margin: 0;">{{ page.calories }}</p>
        </div>

        <div class="ad-box" onclick="window.open('https://link.coupang.com/...')">[AD] RECIPE MATE 추천 조리도구 세트 보기 ></div>
        
        <div style="color: #ccc; line-height: 1.8; font-size: 16px;">
            {{ content }}
        </div>
    </div>
    
    <div class="recommend-side">
        <h3 style="border-left: 5px solid #ff0042; padding-left: 12px;">다른 레시피</h3>
        {% for post in site.posts limit:12 %}
        <a href="{{ post.url | relative_url }}" class="side-item">
            <div class="side-thumb" style="background-image: url('{{ post.image }}');"></div>
            <div style="font-size: 13px;">{{ post.title }}</div>
        </a>
        {% endfor %}
    </div>
</div>
</body>
</html>
